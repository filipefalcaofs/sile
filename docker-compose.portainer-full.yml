# Stack da aplicação SILE — deploy via imagem do Docker Hub.
#
# A imagem é gerada automaticamente pelo GitHub Actions (/.github/workflows/docker-publish.yml)
# a cada push na branch main: filipefalcaofs97/sile:latest
#
# Pré-requisito: stack sile-infra no ar (cria a rede sile_net e os
# serviços pgsql/redis acessíveis por hostname dentro da rede).
#
# Portainer → Stacks → Add stack → Repository
#   Repository URL:  https://github.com/filipefalcaofs/sile.git
#   Compose path:    docker-compose.portainer-full.yml
#   Branch:          main
#
# Para atualizar: faça push na main e clique em "Pull and redeploy"
# marcando "Re-pull image and redeploy" no Portainer.

name: sile-app

x-sile-image: &sile-image filipefalcaofs97/sile:latest

x-app-env: &app-env
  APP_NAME: ${APP_NAME:-SILE}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?defina APP_KEY}
  APP_DEBUG: 'false'
  APP_URL: ${APP_URL:?defina APP_URL}
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: pgsql
  DB_HOST: pgsql
  DB_PORT: '5432'
  DB_DATABASE: ${DB_DATABASE:-sile}
  DB_USERNAME: ${DB_USERNAME:-sile}
  DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
  SESSION_DRIVER: redis
  SESSION_LIFETIME: '120'
  SESSION_ENCRYPT: 'false'
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  REDIS_PASSWORD: 'null'
  REDIS_PORT: '6379'
  MAIL_MAILER: ${MAIL_MAILER:-log}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@sile.sedur.ba.gov.br}
  MAIL_FROM_NAME: ${APP_NAME:-SILE}
  RESEND_KEY: ${RESEND_KEY:-}

services:
  migrate:
    image: *sile-image
    pull_policy: always
    container_name: sile-migrate
    entrypoint: ['/bin/sh', '-ce']
    command:
      - |
        host="${DB_HOST:-pgsql}"
        port="${DB_PORT:-5432}"
        echo "[migrate] aguardando PostgreSQL em ${host}:${port}..."
        n=0
        until php -r "exit(@fsockopen('${host}', ${port}) ? 0 : 1);" 2>/dev/null; do
          n=$((n+1))
          [ "$n" -ge 60 ] && echo "[migrate] timeout" && exit 1
          sleep 2
        done
        echo "[migrate] executando migrations..."
        php artisan migrate --force --no-interaction -vvv
    environment:
      APP_KEY: ${APP_KEY:?defina APP_KEY}
      APP_ENV: production
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: '5432'
      DB_DATABASE: ${DB_DATABASE:-sile}
      DB_USERNAME: ${DB_USERNAME:-sile}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    networks:
      - sile_net
    restart: 'no'

  app:
    image: *sile-image
    pull_policy: always
    container_name: sile-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-8082}:8000'
    environment:
      <<: *app-env
      RUN_MIGRATIONS: 'false'
    networks:
      sile_net: {}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/up || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  queue:
    image: *sile-image
    pull_policy: missing
    container_name: sile-queue
    restart: unless-stopped
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3', '--max-time=3600']
    environment:
      <<: *app-env
      RUN_MIGRATIONS: 'false'
    networks:
      sile_net: {}
    depends_on:
      app:
        condition: service_started
      migrate:
        condition: service_completed_successfully

networks:
  sile_net:
    external: true
