openapi: 3.0.3
info:
  title: Viabiliza — recebimento REGIN (api_integracao/recebe)
  version: "2.0.0"
  description: |
    API chamada pelo REGIN para enviar o processo de viabilidade.

    Não envie token nem header `JWT`.

    O `GET /api_integracao/recebe` testa a conectividade e devolve o texto `3`.

    O `POST` na mesma URL aceita `application/json` em um destes corpos:

    - `ProcessoDeclaracao` — declaração do processo.
    - `EnvioDto` — envelope da JUCEB, serviço `WsProSol098`.

    ## Resposta do POST

    | Código | HTTP | Significado |
    | --- | --- | --- |
    | `3` | 200 | Protocolo gravado. |
    | `5` | 200 | Esse `protocolo` já foi recebido. |
    | `0` | 400 | `protocolo` ausente ou vazio. Nada é gravado. |

    A duplicidade é o número do `protocolo`.

    ## Para o processo ser criado

    Envie também `razaoSocial`, `cnaePrincipal`, `areaUtilizada` maior que zero, `logradouro`, `bairro` e `cep`. Sem algum desses, a resposta continua `3` e o processo não é criado.
  contact:
    name: SEDUR — Viabiliza
    url: https://www.sedur.salvador.ba.gov.br
  externalDocs:
    description: OpenAPI de produção da API REGIN/JUCEB (PSCS), fonte do EnvioDto
    url: http://regin.prefeitura.juceb.ba.gov.br:8080/api_integracao/v3/api-docs

servers:
  - url: https://viabiliza-hml.salvador.ba.gov.br
    description: Homologação
  - url: https://viabiliza.salvador.ba.gov.br
    description: Produção

tags:
  - name: Recebimento
    description: URL da instituição chamada pelo REGIN

paths:
  /api_integracao/recebe:
    get:
      tags: [Recebimento]
      operationId: pingRecebe
      summary: Teste de conectividade
      description: |
        Teste de conectividade, antes do POST. Corpo da resposta, em texto puro: `3`.
      responses:
        "200":
          description: Conectividade confirmada
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoRecebido"
              example: "3"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

    post:
      tags: [Recebimento]
      operationId: recebeProcesso
      summary: Recebe o processo enviado pelo REGIN
      description: |
        Recebe o processo e responde em texto puro.

        - `3` — protocolo gravado agora (HTTP 200).
        - `5` — o mesmo `protocolo` já existe (HTTP 200).
        - `0` — `protocolo` ausente ou vazio (HTTP 400). Nada é gravado.

        No `EnvioDto`, o processo é criado quando o `Ruc` traz CNAE principal, área utilizada maior que zero, logradouro, bairro e CEP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ProcessoDeclaracao"
                - $ref: "#/components/schemas/EnvioDto"
            examples:
              declaracao:
                summary: Declaração do processo
                value:
                  protocolo: BAP-2026-0001
                  razaoSocial: Padaria do Porto Ltda
                  cpfSolicitante: "52998224725"
                  nomeSolicitante: Maria Souza
                  emailSolicitante: maria.souza@exemplo.com
                  inscricaoImobiliaria: "12345678"
                  codlog: "212"
                  tipoLogradouro: Rua
                  logradouro: das Flores
                  numero: "100"
                  bairro: Comércio
                  cep: "40020000"
                  pontoReferencia: Em frente à praça
                  municipio: Salvador
                  uf: BA
                  areaUtilizada: 45.75
                  areaConstruida: 216
                  areaTerreno: 300
                  tipoComplemento: Sala
                  descricaoComplemento: "2"
                  categoriaImovel: Comercial
                  cnaePrincipal: "4712100"
                  cnaesSecundarios:
                    - "5611201"
                    - "5620104"
                  perguntas:
                    - cnae: "4712100"
                      pergunta: "12"
                      resposta: Não
                  tipoImovel: Loja
                  porteEmpresa: Microempresa
                  atividadeEmAreaPublica: Sim
                  escritorioVirtual: Sim
                  atividadeAbrigadaEmEscritorioVirtual: Sim
                  prestaServicoDeEscritorioVirtual: Não
                  cnpjEscritorioVirtual: "11222333000181"
                  acessosIndependentes: Sim
                  imovelEmCondominio: Não
                  areaEmbarqueDesembarque: Não
                  possuiConcessaoDeUso: Não
                  atividadesExercidasNoLocal:
                    - cnae: "4712100"
                      exercida: Sim
                  poligonoDeclarado:
                    type: Polygon
                    coordinates:
                      - - [-38.516331, -12.977852]
                        - [-38.516291, -12.977746]
                        - [-38.516453, -12.977688]
                        - [-38.516492, -12.977795]
                        - [-38.516331, -12.977852]
                  coordenadaGeografica:
                    latitude: -12.977852
                    longitude: -38.516331
                  evento: Inscrição de primeiro estabelecimento (Matriz)
                  objetoSocial: Comércio varejista de produtos de padaria
                  naturezaJuridica: Sociedade Empresária Limitada
                  termoDispensaViabilidadeLocacional: Não
                  meiDesenquadrado: Não
                  contador:
                    nome: Contabilidade Souza
                    documento: "52998224725"
                    crc: BA-012345/O
                  servico: Consulta de viabilidade
                  dataAbertura: "2026-10-03"
              envelope:
                summary: Envelope EnvioDto da JUCEB
                value:
                  cnpjDestino: "13927801000149"
                  cnpjEmpresa: "13927801000149"
                  cnpjOrigem: "13927801000149"
                  codFuncao: 103
                  dataGeracao: "2026-09-16T16:00:00.000Z"
                  nire: "00000000000"
                  protocolo: "43747"
                  servico: WsProSol098
                  json:
                    rowset:
                      RUC_GENERAL:
                        RGE_CGC_CPF: "13927801000149"
                        RGE_NOMB: Empresa exemplo
                      RUC_ESTAB:
                        RES_AREA: "834"
                        RES_DIRECCION: Rua das Flores
                        RES_NUME: "100"
                        RES_IDENT_COMP: Sala 2
                        RES_URBANIZACION: Centro
                        RES_ZONA_POSTAL: "40000000"
                      GROUPRUC_ACTV_ECON:
                        RUC_ACTV_ECON:
                          - RAE_TAE_COD_ACTVD: "4712100"
                            RAE_CALIF_ACTV: "1"
                      GROUPRUC_GEN_PROTOCOLO:
                        RUC_GEN_PROTOCOLO:
                          - RGP_TGE_COD_TIP_TAB: "5"
                            RGP_VALOR: "123456"
      responses:
        "200":
          description: Recebido (`3`) ou protocolo já existente (`5`)
          content:
            text/plain:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CodigoRecebido"
                  - $ref: "#/components/schemas/CodigoDuplicado"
              examples:
                recebido:
                  summary: Primeira entrega do protocolo
                  value: "3"
                duplicado:
                  summary: Protocolo já gravado
                  value: "5"
        "400":
          description: Protocolo ausente. Corpo em texto puro `0`. Nenhum registro é criado.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoInvalido"
              example: "0"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

components:
  responses:
    LimiteExcedido:
      description: |
        Mais de 60 chamadas por minuto a partir do mesmo IP.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Too Many Requests

  schemas:
    CodigoRecebido:
      type: string
      enum: ["3"]
      description: Sucesso. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoDuplicado:
      type: string
      enum: ["5"]
      description: Protocolo duplicado. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoInvalido:
      type: string
      enum: ["0"]
      description: Requisição recusada pelo Viabiliza por falta de protocolo.

    ProcessoDeclaracao:
      type: object
      description: |
        Dados do processo enviados no POST. `protocolo` é a chave de
        duplicidade (número BAP). O CNPJ do escritório virtual só é
        considerado quando `atividadeAbrigadaEmEscritorioVirtual` é sim.
      required: [protocolo]
      properties:
        protocolo:
          type: string
          description: Número do protocolo (BAP).
          example: BAP-2026-0001
        razaoSocial:
          type: string
          description: Razão social.
        cpfSolicitante:
          type: string
          description: CPF do solicitante, com ou sem máscara.
        nomeSolicitante:
          type: string
          description: Nome do solicitante.
        emailSolicitante:
          type: string
          format: email
          description: E-mail do solicitante.
        inscricaoImobiliaria:
          type: string
          description: Número da inscrição imobiliária (IPTU).
        codlog:
          type: string
          description: CODLOG do logradouro.
        tipoLogradouro:
          type: string
          description: Tipo de logradouro (Rua, Avenida, Travessa).
        logradouro:
          type: string
          description: Nome do logradouro.
        numero:
          type: string
          description: Número do imóvel. Vazio vira `s/n`.
        bairro:
          type: string
          description: Bairro ou loteamento.
        cep:
          type: string
          description: CEP, com ou sem máscara.
        pontoReferencia:
          type: string
          description: Ponto de referência ou perímetro.
        municipio:
          type: string
          description: Cidade ou município.
        uf:
          type: string
          description: Estado, sigla de duas letras.
          example: BA
        areaUtilizada:
          description: |
            Área da atividade, em m². Número ou texto com vírgula decimal.
            Maior que zero para o processo ser criado. Não é a área do imóvel.
            O campo `area` é sinônimo antigo.
          oneOf:
            - type: number
            - type: string
        area:
          deprecated: true
          description: Sinônimo histórico de `areaUtilizada`. Prefira `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        areaConstruida:
          description: Área construída do imóvel, em m². Registrada no processo; não substitui `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        areaTerreno:
          description: Área do terreno, em m². Registrada no processo; não substitui `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        tipoComplemento:
          type: string
          description: Tipo de complemento (Sala, Loja, Andar).
        descricaoComplemento:
          type: string
          description: Descrição do complemento.
        categoriaImovel:
          type: string
          description: Categoria do imóvel.
        cnaePrincipal:
          type: string
          description: CNAE principal, com ou sem máscara. Obrigatório para o processo ser criado.
        cnaesSecundarios:
          type: array
          description: Todos os CNAEs secundários.
          items:
            type: string
        perguntas:
          type: array
          description: Pergunta e resposta associadas a cada CNAE.
          items:
            type: object
            required: [cnae, pergunta, resposta]
            properties:
              cnae:
                type: string
              pergunta:
                type: string
                description: Número ou texto da pergunta.
              resposta:
                type: string
                description: Resposta informada. Use Sim ou Não.
        tipoImovel:
          type: string
          description: Tipo de imóvel.
        porteEmpresa:
          type: string
          description: Porte da empresa.
        atividadeEmAreaPublica:
          description: Resposta a "A atividade está estabelecida em área pública?".
          oneOf:
            - type: boolean
            - type: string
        escritorioVirtual:
          description: Resposta a "Trata-se de escritório virtual?".
          oneOf:
            - type: boolean
            - type: string
        atividadeAbrigadaEmEscritorioVirtual:
          description: Resposta a "Sua atividade será abrigada em um escritório virtual?".
          oneOf:
            - type: boolean
            - type: string
        prestaServicoDeEscritorioVirtual:
          description: |
            Resposta a "Irá prestar serviço de escritório virtual, centro de
            negócios ou coworking?". Sim, Não ou boolean. Se omitido, vale Não.
          oneOf:
            - type: boolean
            - type: string
        cnpjEscritorioVirtual:
          type: string
          description: CNPJ do escritório virtual. Gravado só quando a atividade está abrigada.
        acessosIndependentes:
          description: |
            Resposta a "O imóvel possui acessos independentes?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        poligonoDeclarado:
          type: object
          description: |
            Polígono do imóvel em GeoJSON, EPSG:4326, ordem [longitude, latitude].
            Aceita `Polygon`, `MultiPolygon` ou um `Feature` que os contenha.
            Linha e ponto são ignorados.
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon, Feature]
            coordinates:
              type: array
              items: {}
          example:
            type: Polygon
            coordinates:
              - - [-38.516331, -12.977852]
                - [-38.516291, -12.977746]
                - [-38.516453, -12.977688]
                - [-38.516492, -12.977795]
                - [-38.516331, -12.977852]
        coordenadaGeografica:
          type: object
          description: |
            Latitude e longitude do estabelecimento.
          properties:
            latitude:
              type: number
              example: -12.977852
            longitude:
              type: number
              example: -38.516331
        atividadesExercidasNoLocal:
          type: array
          description: Por CNAE, se a atividade é exercida no local (campo padrão REDESIM).
          items:
            type: object
            required: [cnae, exercida]
            properties:
              cnae:
                type: string
              exercida:
                description: Sim ou Não.
                oneOf:
                  - type: boolean
                  - type: string
        evento:
          type: string
          description: Evento do pedido (abertura de matriz, alteração de endereço, alteração de atividade).
          example: Inscrição de primeiro estabelecimento (Matriz)
        objetoSocial:
          type: string
          description: Descrição do objeto social declarado.
        naturezaJuridica:
          type: string
          description: Natureza jurídica da empresa.
        imovelEmCondominio:
          description: Resposta a "Imóvel em condomínio?".
          oneOf:
            - type: boolean
            - type: string
        areaEmbarqueDesembarque:
          description: Resposta a "Possui área de embarque/desembarque?".
          oneOf:
            - type: boolean
            - type: string
        possuiConcessaoDeUso:
          description: Resposta a "Possui concessão de uso?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        termoDispensaViabilidadeLocacional:
          description: |
            Aceite do termo de dispensa de viabilidade locacional. Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        bapAnteriorIndeferido:
          type: string
          description: BAP, BAN ou BAB indeferido que originou este novo pedido.
          example: BAP-2025-0777
        meiDesenquadrado:
          description: Pedido originado de MEI desenquadrado.
          oneOf:
            - type: boolean
            - type: string
        contador:
          type: object
          description: Contador que preencheu o pedido, quando o solicitante é contador.
          properties:
            nome:
              type: string
            documento:
              type: string
              description: CPF ou CNPJ, só dígitos.
            crc:
              type: string
              example: BA-012345/O
        servico:
          type: string
          description: Serviço solicitado.
        dataAbertura:
          type: string
          format: date
          description: Data de abertura do processo (AAAA-MM-DD ou data/hora ISO 8601).

    EnvioDto:
      type: object
      description: |
        Espelho do schema `EnvioDto` da OpenAPI de produção da JUCEB
        (`/api_integracao/v3/api-docs`). Na Junta, `dataGeracao`, `json` e
        `protocolo` são obrigatórios. No Viabiliza, a única rejeição explícita
        é `protocolo` vazio (HTTP 400, corpo `0`).
      required: [protocolo]
      properties:
        protocolo:
          type: string
          description: Número do processo na Junta. Chave de duplicidade.
          example: "43747"
        dataGeracao:
          type: string
          format: date-time
          description: Data e hora de geração do envelope (ISO 8601, como na OpenAPI da JUCEB).
          example: "2026-09-16T16:00:00.000Z"
        json:
          $ref: "#/components/schemas/Ruc"
        cnpjDestino:
          type: string
          description: CNPJ da instituição que recebe. Na OpenAPI da JUCEB, 14 dígitos com pontuação opcional.
          example: "13927801000149"
        cnpjEmpresa:
          type: string
          description: CNPJ da empresa, quando a Junta envia.
          example: "13927801000149"
        cnpjOrigem:
          type: string
          description: CNPJ de origem dos dados. Na OpenAPI da JUCEB, 14 dígitos com pontuação opcional.
          example: "13927801000149"
        codFuncao:
          type: integer
          format: int32
          description: |
            Código de função do envelope, conforme a JUCEB. O Viabiliza grava
            o inteiro recebido e não restringe a lista. Exemplo da OpenAPI da
            Junta: `3`.
          example: 3
        nire:
          type: string
          description: NIRE ou matrícula, quando a Junta envia.
        servico:
          type: string
          description: Serviço REGIN. No guia e na OpenAPI da JUCEB, `WsProSol098`.
          example: WsProSol098
        xml:
          type: string
          description: Payload legado em XML. A integração atual usa `json`.

    Ruc:
      type: object
      description: |
        Conteúdo do envelope. Os grupos abaixo são os usados para criar o processo. Os demais podem ser enviados; o código de retorno não muda.
      properties:
        rowset:
          $ref: "#/components/schemas/RowsetViabiliza"

    RowsetViabiliza:
      type: object
      description: Grupos do `rowset` usados para criar o processo.
      properties:
        RUC_GENERAL:
          type: object
          description: Empresa. Schema `RUCGENERAL` na OpenAPI da JUCEB.
          properties:
            RGE_CGC_CPF:
              type: string
              description: CNPJ ou CPF da empresa.
            RGE_NOMB:
              type: string
              description: Nome empresarial.
        RUC_ESTAB:
          type: object
          description: |
            Estabelecimento. Sem área, logradouro, bairro ou CEP, o processo não é criado.
          properties:
            RES_AREA:
              type: string
              description: Área utilizada, em m². Maior que zero para o processo ser criado.
            RES_DIRECCION:
              type: string
              description: Logradouro.
            RES_NUME:
              type: string
              description: Número. Vazio vira `s/n`.
            RES_IDENT_COMP:
              type: string
              description: Complemento.
            RES_URBANIZACION:
              type: string
              description: Bairro.
            RES_ZONA_POSTAL:
              type: string
              description: CEP.
        GROUPRUC_ACTV_ECON:
          type: object
          description: Atividades. Schema `GROUPRUCACTVECON` na OpenAPI da JUCEB.
          properties:
            RUC_ACTV_ECON:
              type: array
              items:
                type: object
                properties:
                  RAE_TAE_COD_ACTVD:
                    type: string
                    description: Código da atividade (CNAE).
                  RAE_CALIF_ACTV:
                    type: string
                    description: "`1` marca a atividade principal. Sem principal, o processo não é criado."
        GROUPRUC_GEN_PROTOCOLO:
          type: object
          description: Dados genéricos do protocolo. Schema `GROUPRUCGENPROTOCOLO` na OpenAPI da JUCEB.
          properties:
            RUC_GEN_PROTOCOLO:
              type: array
              items:
                type: object
                properties:
                  RGP_TGE_COD_TIP_TAB:
                    type: string
                    description: "`5` identifica a inscrição imobiliária."
                  RGP_VALOR:
                    type: string
                    description: Valor do item. Na tabulação 5, a inscrição imobiliária.
