openapi: 3.0.3
info:
  title: Viabiliza — recebimento REGIN (api_integracao/recebe)
  version: "2.0.0"
  description: |
    API chamada pelo REGIN para enviar o processo de viabilidade.

    Não envie token nem header `JWT`.

    O `GET /api_integracao/recebe` testa a conectividade e devolve o texto `3`.

    O `POST` na mesma URL recebe `application/json` no formato `ProcessoDeclaracao`.

    ## Resposta do POST

    | Código | HTTP | Significado |
    | --- | --- | --- |
    | `3` | 200 | Protocolo gravado. |
    | `5` | 200 | Esse `protocolo` já foi recebido. |
    | `0` | 400 | Recusado: `protocolo` ausente ou vazio, ou falta dado que abre o processo (`razaoSocial`, `cnaePrincipal`, `areaUtilizada` maior que zero, `logradouro`, `bairro` ou `cep`). Nada é gravado. |

    A duplicidade é o número do `protocolo`.

    ## Para o processo ser criado

    Envie também `razaoSocial`, `cnaePrincipal`, `areaUtilizada` maior que zero, `logradouro`, `bairro` e `cep`. Sem algum desses a resposta é `0` (HTTP 400) e nada é gravado.
  contact:
    name: SEDUR — Viabiliza
    url: https://www.sedur.salvador.ba.gov.br

servers:
  - url: https://viabiliza-hml.salvador.ba.gov.br
    description: Homologação
  - url: https://viabiliza.salvador.ba.gov.br
    description: Produção

tags:
  - name: Recebimento
    description: URL da instituição chamada pelo REGIN

paths:
  /api_integracao/recebe:
    get:
      tags: [Recebimento]
      operationId: pingRecebe
      summary: Teste de conectividade
      description: |
        Teste de conectividade, antes do POST. Corpo da resposta, em texto puro: `3`.
      responses:
        "200":
          description: Conectividade confirmada
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoRecebido"
              example: "3"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

    post:
      tags: [Recebimento]
      operationId: recebeProcesso
      summary: Recebe o processo enviado pelo REGIN
      description: |
        Recebe o processo e responde em texto puro.

        - `3` — protocolo gravado agora (HTTP 200).
        - `5` — o mesmo `protocolo` já existe (HTTP 200).
        - `0` — recusado: `protocolo` ausente, ou falta razão social, CNAE principal, área, logradouro, bairro ou CEP (HTTP 400). Nada é gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessoDeclaracao"
            examples:
              declaracao:
                summary: Declaração do processo
                value:
                  protocolo: BAP-2026-0001
                  razaoSocial: Padaria do Porto Ltda
                  cpfSolicitante: "52998224725"
                  nomeSolicitante: Maria Souza
                  emailSolicitante: maria.souza@exemplo.com
                  inscricaoImobiliaria: "12345678"
                  codlog: "212"
                  tipoLogradouro: Rua
                  logradouro: das Flores
                  numero: "100"
                  bairro: Comércio
                  cep: "40020000"
                  pontoReferencia: Em frente à praça
                  municipio: Salvador
                  uf: BA
                  areaUtilizada: 45.75
                  areaConstruida: 216
                  areaTerreno: 300
                  tipoComplemento: Sala
                  descricaoComplemento: "2"
                  categoriaImovel: Comercial
                  cnaePrincipal: "4712100"
                  cnaesSecundarios:
                    - "5611201"
                    - "5620104"
                  perguntas:
                    - cnae: "4712100"
                      pergunta: "12"
                      resposta: Não
                  tipoImovel: Loja
                  porteEmpresa: Microempresa
                  atividadeEmAreaPublica: Sim
                  escritorioVirtual: Sim
                  atividadeAbrigadaEmEscritorioVirtual: Sim
                  prestaServicoDeEscritorioVirtual: Não
                  cnpjEscritorioVirtual: "11222333000181"
                  acessosIndependentes: Sim
                  imovelEmCondominio: Não
                  areaEmbarqueDesembarque: Não
                  possuiConcessaoDeUso: Não
                  atividadesExercidasNoLocal:
                    - cnae: "4712100"
                      exercida: Sim
                  poligonoDeclarado:
                    type: Polygon
                    coordinates:
                      - - [-38.516331, -12.977852]
                        - [-38.516291, -12.977746]
                        - [-38.516453, -12.977688]
                        - [-38.516492, -12.977795]
                        - [-38.516331, -12.977852]
                  coordenadaGeografica:
                    latitude: -12.977852
                    longitude: -38.516331
                  evento: Inscrição de primeiro estabelecimento (Matriz)
                  objetoSocial: Comércio varejista de produtos de padaria
                  naturezaJuridica: Sociedade Empresária Limitada
                  termoDispensaViabilidadeLocacional: Não
                  meiDesenquadrado: Não
                  contador:
                    nome: Contabilidade Souza
                    documento: "52998224725"
                    crc: BA-012345/O
                  servico: Consulta de viabilidade
                  dataAbertura: "2026-10-03"
                  cnpjDestino: "13927801000149"
                  cnpjEmpresa: "13927801000149"
                  cnpjOrigem: "13927801000149"
                  codFuncao: 103
                  dataGeracao: "2026-09-16T16:00:00.000Z"
                  nire: "00000000000"
                  RAE_CALIF_ACTV: "1"
                  RGP_TGE_COD_TIP_TAB: "5"
                  RGP_VALOR: "12345678"
      responses:
        "200":
          description: Recebido (`3`) ou protocolo já existente (`5`)
          content:
            text/plain:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CodigoRecebido"
                  - $ref: "#/components/schemas/CodigoDuplicado"
              examples:
                recebido:
                  summary: Primeira entrega do protocolo
                  value: "3"
                duplicado:
                  summary: Protocolo já gravado
                  value: "5"
        "400":
          description: Recusado. Protocolo ausente, ou falta razão social, CNAE principal, área, logradouro, bairro ou CEP. Corpo em texto puro `0`. Nenhum registro é criado.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoInvalido"
              example: "0"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

components:
  responses:
    LimiteExcedido:
      description: |
        Mais de 60 chamadas por minuto a partir do mesmo IP.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Too Many Requests

  schemas:
    CodigoRecebido:
      type: string
      enum: ["3"]
      description: Sucesso. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoDuplicado:
      type: string
      enum: ["5"]
      description: Protocolo duplicado. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoInvalido:
      type: string
      enum: ["0"]
      description: Recusado. Falta o protocolo ou dado que abre o processo (razão social, CNAE principal, área, logradouro, bairro ou CEP).

    ProcessoDeclaracao:
      type: object
      description: |
        Dados do processo enviados no POST. `protocolo` é a chave de
        duplicidade (número BAP). O CNPJ do escritório virtual só é
        considerado quando `atividadeAbrigadaEmEscritorioVirtual` é sim.
      required: [protocolo]
      properties:
        protocolo:
          type: string
          description: Número do protocolo (BAP).
          example: BAP-2026-0001
        razaoSocial:
          type: string
          description: Razão social.
        cpfSolicitante:
          type: string
          description: CPF do solicitante, com ou sem máscara.
        nomeSolicitante:
          type: string
          description: Nome do solicitante.
        emailSolicitante:
          type: string
          format: email
          description: E-mail do solicitante.
        inscricaoImobiliaria:
          type: string
          description: Número da inscrição imobiliária (IPTU).
        codlog:
          type: string
          description: CODLOG do logradouro.
        tipoLogradouro:
          type: string
          description: Tipo de logradouro (Rua, Avenida, Travessa).
        logradouro:
          type: string
          description: Nome do logradouro.
        numero:
          type: string
          description: Número do imóvel. Vazio vira `s/n`.
        bairro:
          type: string
          description: Bairro ou loteamento.
        cep:
          type: string
          description: CEP, com ou sem máscara.
        pontoReferencia:
          type: string
          description: Ponto de referência ou perímetro.
        municipio:
          type: string
          description: Cidade ou município.
        uf:
          type: string
          description: Estado, sigla de duas letras.
          example: BA
        areaUtilizada:
          description: |
            Área da atividade, em m². Número ou texto com vírgula decimal.
            Maior que zero para o processo ser criado. Não é a área do imóvel.
            O campo `area` é sinônimo antigo.
          oneOf:
            - type: number
            - type: string
        area:
          deprecated: true
          description: Sinônimo histórico de `areaUtilizada`. Prefira `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        areaConstruida:
          description: Área construída do imóvel, em m². Registrada no processo; não substitui `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        areaTerreno:
          description: Área do terreno, em m². Registrada no processo; não substitui `areaUtilizada`.
          oneOf:
            - type: number
            - type: string
        tipoComplemento:
          type: string
          description: Tipo de complemento (Sala, Loja, Andar).
        descricaoComplemento:
          type: string
          description: Descrição do complemento.
        categoriaImovel:
          type: string
          description: Categoria do imóvel.
        cnaePrincipal:
          type: string
          description: CNAE principal, com ou sem máscara. Obrigatório para o processo ser criado.
        cnaesSecundarios:
          type: array
          description: Todos os CNAEs secundários.
          items:
            type: string
        perguntas:
          type: array
          description: Pergunta e resposta associadas a cada CNAE.
          items:
            type: object
            required: [cnae, pergunta, resposta]
            properties:
              cnae:
                type: string
              pergunta:
                type: string
                description: Número ou texto da pergunta.
              resposta:
                type: string
                description: Resposta informada. Use Sim ou Não.
        tipoImovel:
          type: string
          description: Tipo de imóvel.
        porteEmpresa:
          type: string
          description: Porte da empresa.
        atividadeEmAreaPublica:
          description: Resposta a "A atividade está estabelecida em área pública?".
          oneOf:
            - type: boolean
            - type: string
        escritorioVirtual:
          description: Resposta a "Trata-se de escritório virtual?".
          oneOf:
            - type: boolean
            - type: string
        atividadeAbrigadaEmEscritorioVirtual:
          description: Resposta a "Sua atividade será abrigada em um escritório virtual?".
          oneOf:
            - type: boolean
            - type: string
        prestaServicoDeEscritorioVirtual:
          description: |
            Resposta a "Irá prestar serviço de escritório virtual, centro de
            negócios ou coworking?". Sim, Não ou boolean. Se omitido, vale Não.
          oneOf:
            - type: boolean
            - type: string
        cnpjEscritorioVirtual:
          type: string
          description: CNPJ do escritório virtual. Gravado só quando a atividade está abrigada.
        acessosIndependentes:
          description: |
            Resposta a "O imóvel possui acessos independentes?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        poligonoDeclarado:
          type: object
          description: |
            Polígono do imóvel em GeoJSON, EPSG:4326, ordem [longitude, latitude].
            Aceita `Polygon`, `MultiPolygon` ou um `Feature` que os contenha.
            Linha e ponto são ignorados.
          properties:
            type:
              type: string
              enum: [Polygon, MultiPolygon, Feature]
            coordinates:
              type: array
              items: {}
          example:
            type: Polygon
            coordinates:
              - - [-38.516331, -12.977852]
                - [-38.516291, -12.977746]
                - [-38.516453, -12.977688]
                - [-38.516492, -12.977795]
                - [-38.516331, -12.977852]
        coordenadaGeografica:
          type: object
          description: |
            Latitude e longitude do estabelecimento.
          properties:
            latitude:
              type: number
              example: -12.977852
            longitude:
              type: number
              example: -38.516331
        atividadesExercidasNoLocal:
          type: array
          description: Por CNAE, se a atividade é exercida no local (campo padrão REDESIM).
          items:
            type: object
            required: [cnae, exercida]
            properties:
              cnae:
                type: string
              exercida:
                description: Sim ou Não.
                oneOf:
                  - type: boolean
                  - type: string
        evento:
          type: string
          description: Evento do pedido (abertura de matriz, alteração de endereço, alteração de atividade).
          example: Inscrição de primeiro estabelecimento (Matriz)
        objetoSocial:
          type: string
          description: Descrição do objeto social declarado.
        naturezaJuridica:
          type: string
          description: Natureza jurídica da empresa.
        imovelEmCondominio:
          description: Resposta a "Imóvel em condomínio?".
          oneOf:
            - type: boolean
            - type: string
        areaEmbarqueDesembarque:
          description: Resposta a "Possui área de embarque/desembarque?".
          oneOf:
            - type: boolean
            - type: string
        possuiConcessaoDeUso:
          description: Resposta a "Possui concessão de uso?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        termoDispensaViabilidadeLocacional:
          description: |
            Aceite do termo de dispensa de viabilidade locacional. Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        bapAnteriorIndeferido:
          type: string
          description: BAP, BAN ou BAB indeferido que originou este novo pedido.
          example: BAP-2025-0777
        meiDesenquadrado:
          description: Pedido originado de MEI desenquadrado.
          oneOf:
            - type: boolean
            - type: string
        contador:
          type: object
          description: Contador que preencheu o pedido, quando o solicitante é contador.
          properties:
            nome:
              type: string
            documento:
              type: string
              description: CPF ou CNPJ, só dígitos.
            crc:
              type: string
              example: BA-012345/O
        servico:
          type: string
          description: Serviço solicitado.
        dataAbertura:
          type: string
          format: date
          description: Data de abertura do processo (AAAA-MM-DD ou data/hora ISO 8601).
        cnpjDestino:
          type: string
          description: CNPJ da instituição que recebe. 14 dígitos, com pontuação opcional.
          example: "13927801000149"
        cnpjEmpresa:
          type: string
          description: CNPJ da empresa.
          example: "13927801000149"
        cnpjOrigem:
          type: string
          description: CNPJ de origem dos dados. 14 dígitos, com pontuação opcional.
          example: "13927801000149"
        codFuncao:
          type: integer
          format: int32
          description: Código de função do envio. O inteiro recebido é gravado como veio.
          example: 103
        dataGeracao:
          type: string
          format: date-time
          description: Data e hora de geração do envio, em ISO 8601.
          example: "2026-09-16T16:00:00.000Z"
        nire:
          type: string
          description: NIRE ou matrícula.
          example: "00000000000"
        RAE_CALIF_ACTV:
          type: string
          description: Qualificação da atividade. `1` indica a atividade principal.
          example: "1"
        RGP_TGE_COD_TIP_TAB:
          type: string
          description: Código do tipo do item genérico do protocolo. `5` identifica a inscrição imobiliária.
          example: "5"
        RGP_VALOR:
          type: string
          description: Valor do item genérico do protocolo. Quando o tipo é `5`, a inscrição imobiliária.
          example: "12345678"
