openapi: 3.0.3
info:
  title: Viabiliza — recebimento REGIN (api_integracao/recebe)
  version: "2.0.0"
  description: |
    API chamada pelo REGIN para enviar o processo de viabilidade.

    Não envie token nem header `JWT`.

    O `GET /api_integracao/recebe` testa a conectividade e devolve o texto `3`.

    O `POST` na mesma URL recebe `application/json` no formato `ProcessoDeclaracao`.

    ## Resposta do POST

    | Código | HTTP | Significado |
    | --- | --- | --- |
    | `3` | 200 | Protocolo gravado. |
    | `5` | 200 | Esse `protocolo` já foi recebido. |
    | `0` | 400 | Recusado: `protocolo` ausente ou vazio, ou falta dado que abre o processo (`RGE_NOMB`, `RUC_ACTV_ECON` com `RAE_CALIF_ACTV` 1, `RES_AREA` maior que zero, `RES_DIRECCION`, `RES_URBANIZACION` ou `RES_ZONA_POSTAL`). Nada é gravado. |

    A duplicidade é o número do `protocolo`.

    ## Para o processo ser criado

    Envie também `RGE_NOMB`, `RUC_ACTV_ECON` com uma atividade `RAE_CALIF_ACTV` 1, `RES_AREA` maior que zero, `RES_DIRECCION`, `RES_URBANIZACION` e `RES_ZONA_POSTAL`. Sem algum desses a resposta é `0` (HTTP 400) e nada é gravado. O nome é o original do campo.
  contact:
    name: SEDUR — Viabiliza
    url: https://www.sedur.salvador.ba.gov.br

servers:
  - url: https://viabiliza-hml.salvador.ba.gov.br
    description: Homologação
  - url: https://viabiliza.salvador.ba.gov.br
    description: Produção

tags:
  - name: Recebimento
    description: URL da instituição chamada pelo REGIN

paths:
  /api_integracao/recebe:
    get:
      tags: [Recebimento]
      operationId: pingRecebe
      summary: Teste de conectividade
      description: |
        Teste de conectividade, antes do POST. Corpo da resposta, em texto puro: `3`.
      responses:
        "200":
          description: Conectividade confirmada
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoRecebido"
              example: "3"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

    post:
      tags: [Recebimento]
      operationId: recebeProcesso
      summary: Recebe o processo enviado pelo REGIN
      description: |
        Recebe o processo e responde em texto puro.

        - `3` — protocolo gravado agora (HTTP 200).
        - `5` — o mesmo `protocolo` já existe (HTTP 200).
        - `0` — recusado: `protocolo` ausente, ou falta `RGE_NOMB`, atividade principal, `RES_AREA`, `RES_DIRECCION`, `RES_URBANIZACION` ou `RES_ZONA_POSTAL` (HTTP 400). Nada é gravado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessoDeclaracao"
            examples:
              declaracao:
                summary: Declaração do processo
                value:
                  protocolo: BAP-2026-0001
                  RGE_NOMB: Padaria do Porto Ltda
                  cpfSolicitante: "52998224725"
                  nomeSolicitante: Maria Souza
                  emailSolicitante: maria.souza@exemplo.com
                  RES_TTL_TIP_LOGRADORO: Rua
                  RES_DIRECCION: das Flores
                  RES_NUME: "100"
                  RES_URBANIZACION: Comércio
                  RES_ZONA_POSTAL: "40020000"
                  RES_REFER: Em frente à praça
                  RES_TMU_DESC_MUN: Salvador
                  RES_TES_COD_ESTADO: BA
                  RES_AREA: 45.75
                  RES_IDENT_COMP: "2"
                  RUC_ACTV_ECON:
                    - RAE_TAE_COD_ACTVD: "4712100"
                      RAE_CALIF_ACTV: "1"
                    - RAE_TAE_COD_ACTVD: "5611201"
                      RAE_CALIF_ACTV: "2"
                    - RAE_TAE_COD_ACTVD: "5620104"
                      RAE_CALIF_ACTV: "2"
                  perguntas:
                    - cnae: "4712100"
                      pergunta: "12"
                      resposta: Não
                  RGE_TGE_VTAMANHO: "1"
                  atividadeEmAreaPublica: Sim
                  possuiConcessaoDeUso: Não
                  trataSeDeEscritorioVirtual: Sim
                  prestaServicoDeEscritorioVirtual: Não
                  cnpjEscritorioVirtual: "11222333000181"
                  imovelEmCondominio: Não
                  areaEmbarqueDesembarque: Não
                  vagasEmbarqueDesembarque: 2
                  vagasEstacionamento: 10
                  RES_DS_EVENTO: Inscrição de primeiro estabelecimento (Matriz)
                  RES_CNPJ_SEDE: "13927801000149"
                  termoDispensaViabilidadeLocacional: Não
                  meiDesenquadrado: Não
                  servico: Consulta de viabilidade
                  dataAbertura: "2026-10-03"
                  cnpjEmpresa: "13927801000149"
                  codFuncao: 103
                  dataGeracao: "2026-09-16T16:00:00.000Z"
                  nire: "00000000000"
                  RAE_CALIF_ACTV: "1"
                  RGP_TGE_COD_TIP_TAB: "5"
                  RGP_VALOR: "12345678"
      responses:
        "200":
          description: Recebido (`3`) ou protocolo já existente (`5`)
          content:
            text/plain:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CodigoRecebido"
                  - $ref: "#/components/schemas/CodigoDuplicado"
              examples:
                recebido:
                  summary: Primeira entrega do protocolo
                  value: "3"
                duplicado:
                  summary: Protocolo já gravado
                  value: "5"
        "400":
          description: Recusado. Protocolo ausente, ou falta `RGE_NOMB`, atividade principal em `RUC_ACTV_ECON`, `RES_AREA`, `RES_DIRECCION`, `RES_URBANIZACION` ou `RES_ZONA_POSTAL`. Corpo em texto puro `0`. Nenhum registro é criado.
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/CodigoInvalido"
              example: "0"
        "429":
          $ref: "#/components/responses/LimiteExcedido"

components:
  responses:
    LimiteExcedido:
      description: |
        Mais de 60 chamadas por minuto a partir do mesmo IP.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Too Many Requests

  schemas:
    CodigoRecebido:
      type: string
      enum: ["3"]
      description: Sucesso. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoDuplicado:
      type: string
      enum: ["5"]
      description: Protocolo duplicado. Mesmo código que o `testeEnvio` da JUCEB compara.
    CodigoInvalido:
      type: string
      enum: ["0"]
      description: Recusado. Falta o protocolo ou dado que abre o processo (`RGE_NOMB`, atividade principal, `RES_AREA`, `RES_DIRECCION`, `RES_URBANIZACION` ou `RES_ZONA_POSTAL`).

    ProcessoDeclaracao:
      type: object
      description: |
        Dados do processo enviados no POST. `protocolo` é a chave de
        duplicidade (número BAP). O CNPJ do escritório virtual só é
        considerado quando `atividadeAbrigadaEmEscritorioVirtual` é sim.
      required: [protocolo]
      properties:
        protocolo:
          type: string
          description: Número do protocolo (BAP).
          example: BAP-2026-0001
        RGE_NOMB:
          type: string
          description: Nome empresarial ou razão social. Nome original do campo.
        razaoSocial:
          deprecated: true
          type: string
          description: Sinônimo de `RGE_NOMB`. Prefira `RGE_NOMB`.
        cpfSolicitante:
          type: string
          description: CPF do solicitante, com ou sem máscara.
        nomeSolicitante:
          type: string
          description: Nome do solicitante.
        emailSolicitante:
          type: string
          format: email
          description: E-mail do solicitante.
        inscricaoImobiliaria:
          type: string
          description: Número da inscrição imobiliária (IPTU).
        RES_TTL_TIP_LOGRADORO:
          type: string
          description: Tipo de logradouro do estabelecimento. Nome original do campo.
        tipoLogradouro:
          deprecated: true
          type: string
          description: Sinônimo de `RES_TTL_TIP_LOGRADORO`.
        RES_DIRECCION:
          type: string
          description: Nome do logradouro do estabelecimento. Nome original do campo.
        logradouro:
          deprecated: true
          type: string
          description: Sinônimo de `RES_DIRECCION`.
        RES_NUME:
          type: string
          description: Número do estabelecimento no logradouro. Nome original do campo. Vazio vira `s/n`.
        numero:
          deprecated: true
          type: string
          description: Sinônimo de `RES_NUME`.
        RES_URBANIZACION:
          type: string
          description: Bairro do estabelecimento. Nome original do campo.
        bairro:
          deprecated: true
          type: string
          description: Sinônimo de `RES_URBANIZACION`.
        RES_ZONA_POSTAL:
          type: string
          description: CEP do estabelecimento. Nome original do campo.
        cep:
          deprecated: true
          type: string
          description: Sinônimo de `RES_ZONA_POSTAL`.
        RES_REFER:
          type: string
          description: Referência do endereço. Nome original do campo.
        pontoReferencia:
          deprecated: true
          type: string
          description: Sinônimo de `RES_REFER`.
        RES_TMU_DESC_MUN:
          type: string
          description: Nome do município. Nome original do campo.
        municipio:
          deprecated: true
          type: string
          description: Sinônimo de `RES_TMU_DESC_MUN`.
        RES_TES_COD_ESTADO:
          type: string
          description: UF do estabelecimento. Nome original do campo.
          example: BA
        uf:
          deprecated: true
          type: string
          description: Sinônimo de `RES_TES_COD_ESTADO`.
          example: BA
        RES_AREA:
          description: |
            Área utilizada pela empresa, em m². Nome original do campo. Maior que
            zero para o processo ser criado.
          oneOf:
            - type: number
            - type: string
        areaUtilizada:
          deprecated: true
          description: |
            Sinônimo de `RES_AREA`. Prefira `RES_AREA`.
          oneOf:
            - type: number
            - type: string
        area:
          deprecated: true
          description: Sinônimo histórico de `RES_AREA`. Prefira `RES_AREA`.
          oneOf:
            - type: number
            - type: string
        RES_IDENT_COMP:
          type: string
          description: Complemento do endereço do estabelecimento. Nome original do campo.
        descricaoComplemento:
          deprecated: true
          type: string
          description: Sinônimo de `RES_IDENT_COMP`.
        RUC_ACTV_ECON:
          type: array
          maxItems: 100
          description: |
            Atividades econômicas, como no envio original. `RAE_CALIF_ACTV` `1` é a
            principal; `2` é secundária. Até 100 atividades: uma principal e até 99
            secundárias. Precisa de uma principal para o processo ser criado.
          items:
            type: object
            required: [RAE_TAE_COD_ACTVD, RAE_CALIF_ACTV]
            properties:
              RAE_TAE_COD_ACTVD:
                type: string
                description: Código CNAE.
              RAE_CALIF_ACTV:
                type: string
                description: "`1` principal, `2` secundária."
        cnaePrincipal:
          deprecated: true
          type: string
          description: Sinônimo da atividade com `RAE_CALIF_ACTV` `1` em `RUC_ACTV_ECON`.
        cnaesSecundarios:
          deprecated: true
          type: array
          maxItems: 99
          description: Sinônimo das atividades com `RAE_CALIF_ACTV` `2`.
          items:
            type: string
        perguntas:
          type: array
          description: Pergunta e resposta associadas a cada CNAE.
          items:
            type: object
            required: [cnae, pergunta, resposta]
            properties:
              cnae:
                type: string
              pergunta:
                type: string
                description: Número ou texto da pergunta.
              resposta:
                type: string
                description: Resposta informada. Use Sim ou Não.
        RGE_TGE_VTAMANHO:
          type: string
          description: "Tamanho da empresa, como no envio original. `1` ME, `2` EPP, `3` normal."
          example: "1"
        porteEmpresa:
          deprecated: true
          type: string
          description: Sinônimo de `RGE_TGE_VTAMANHO`.
        atividadeEmAreaPublica:
          description: Resposta a "A atividade está estabelecida em área pública?".
          oneOf:
            - type: boolean
            - type: string
        trataSeDeEscritorioVirtual:
          description: Resposta a "Trata-se de escritório virtual?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        atividadeAbrigadaEmEscritorioVirtual:
          deprecated: true
          description: Sinônimo anterior de `trataSeDeEscritorioVirtual`. Prefira `trataSeDeEscritorioVirtual`.
          oneOf:
            - type: boolean
            - type: string
        prestaServicoDeEscritorioVirtual:
          description: |
            Resposta a "Irá prestar serviço de escritório virtual, centro de
            negócios ou coworking?". Sim, Não ou boolean. Se omitido, vale Não.
          oneOf:
            - type: boolean
            - type: string
        cnpjEscritorioVirtual:
          type: string
          description: CNPJ do escritório virtual. Gravado quando `trataSeDeEscritorioVirtual` é sim.
        RES_DS_EVENTO:
          type: string
          description: Descrição do evento, como no envio original.
          example: Inscrição de primeiro estabelecimento (Matriz)
        RES_CNPJ_SEDE:
          type: string
          description: CNPJ da sede, como no envio original. Na constituição de filial, o CNPJ da matriz.
          example: "13927801000149"
        evento:
          deprecated: true
          type: string
          description: Sinônimo de `RES_DS_EVENTO`.
        imovelEmCondominio:
          description: Resposta a "Imóvel em condomínio?".
          oneOf:
            - type: boolean
            - type: string
        areaEmbarqueDesembarque:
          description: Resposta a "Possui área de embarque/desembarque?".
          oneOf:
            - type: boolean
            - type: string
        vagasEmbarqueDesembarque:
          type: integer
          minimum: 0
          description: Quantidade de vagas de embarque e desembarque. Inteiro maior ou igual a zero; texto só de dígitos também é aceito.
          example: 2
        vagasEstacionamento:
          type: integer
          minimum: 0
          description: Quantidade de vagas de estacionamento. Inteiro maior ou igual a zero; texto só de dígitos também é aceito.
          example: 10
        possuiConcessaoDeUso:
          description: Resposta a "Possui concessão de uso?". Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        termoDispensaViabilidadeLocacional:
          description: |
            Aceite do termo de dispensa de viabilidade locacional. Sim, Não ou boolean.
          oneOf:
            - type: boolean
            - type: string
        meiDesenquadrado:
          description: Pedido originado de MEI desenquadrado.
          oneOf:
            - type: boolean
            - type: string
        servico:
          type: string
          description: Serviço solicitado.
        dataAbertura:
          type: string
          format: date
          description: Data de abertura do processo (AAAA-MM-DD ou data/hora ISO 8601).
        cnpjEmpresa:
          type: string
          description: CNPJ da empresa. Na constituição de filial, o CNPJ da matriz.
          example: "13927801000149"
        codFuncao:
          type: integer
          format: int32
          description: Código de função do envio. O inteiro recebido é gravado como veio.
          example: 103
        dataGeracao:
          type: string
          format: date-time
          description: Data e hora de geração do envio, em ISO 8601.
          example: "2026-09-16T16:00:00.000Z"
        nire:
          type: string
          description: NIRE ou matrícula. Obrigatório nos pedidos de alteração.
          example: "00000000000"
        RAE_CALIF_ACTV:
          type: string
          description: Qualificação da atividade. `1` indica a atividade principal.
          example: "1"
        RGP_TGE_COD_TIP_TAB:
          type: string
          description: Código do tipo do item genérico do protocolo. `5` identifica a inscrição imobiliária.
          example: "5"
        RGP_VALOR:
          type: string
          description: Valor do item genérico do protocolo. Quando o tipo é `5`, a inscrição imobiliária.
          example: "12345678"
