        - : Código do evento na JUCEB.
        - : Nome do evento.
        - : Condição detectada do evento, quando houver.
      security:
        -
          bearerAuth: {}
      parameters:
        - $ref: '#/components/parameters/apos_id'
        - $ref: '#/components/parameters/limite_bruto'
        - $ref: '#/components/parameters/atualizado_desde'
        - $ref: '#/components/parameters/processo_id'
      responses:
        200:
          description: 'Página da tabela.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDados'
        401:
          description: 'Token ausente, inválido ou expirado.'
        422:
          description: 'Parâmetros inválidos.'
        503:
          description: 'Integração desligada.'
