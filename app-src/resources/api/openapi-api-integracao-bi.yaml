openapi: 3.0.3
info:
  title: 'Viabiliza — indicadores para o BI (api_integracao/bi)'
  version: 1.0.0
  description: |-
    Indicadores agregados do Viabiliza para o BI da SEDUR e tabelas de dados brutos (seção Dados brutos) para o BI montar os próprios indicadores. Os indicadores são agregados (o mapa sai em células de grade). Os dados brutos trazem, com a liberação de dados identificados (ligada por padrão), CPF, nomes, contatos, CNPJ, endereço, coordenada exata e textos livres; senha, token e 2FA nunca saem. Acesso só com token.

    ## Autenticação

    1. `POST /api_integracao/bi/autenticar` com `usuario` e `senha` devolve um `token`.
    2. Envie `Authorization: Bearer <token>` nas demais chamadas.
    3. O token vale `expira_em_segundos` (60 minutos).

    ## Convenções

    - Todo indicador responde `{indicador, grupo, titulo, gerado_em, filtros, dados}`; o formato de `dados` varia por indicador.
    - Taxas e médias sem amostra saem `null`, nunca zero.
    - Tempos em horas úteis, salvo indicação.
    - Limite de 120 requisições por minuto por IP.
  contact:
    name: 'SEDUR — Viabiliza'
    url: 'https://www.sedur.salvador.ba.gov.br'
servers:
  - url: 'https://viabiliza-hml.salvador.ba.gov.br'
    description: Homologação
  - url: 'https://viabiliza.salvador.ba.gov.br'
    description: Produção
tags:
  - name: Autenticação
  - name: Catálogo
  - name: 'Indicadores estratégicos'
  - name: 'Inteligência econômica'
  - name: 'Inteligência territorial'
  - name: 'Eficiência operacional'
  - name: 'Automação do licenciamento'
  - name: 'Dados brutos'
    description: 'Uma linha por registro, para o BI montar os próprios indicadores. Paginação por id e carga incremental.'
paths:
  /api_integracao/bi/autenticar:
    post:
      tags:
        - Autenticação
      operationId: autenticarBi
      summary: 'Obter token'
      requestBody:
        required: true
        content:
