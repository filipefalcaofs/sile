      responses:
        200:
          description: 'Token emitido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        401:
          description: 'Usuário ou senha inválidos.'
        503:
          description: 'Integração desligada.'
  /api_integracao/bi/indicadores:
