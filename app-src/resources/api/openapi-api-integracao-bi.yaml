      operationId: catalogoBi
      summary: 'Listar os indicadores'
      description: 'Devolve grupos, filtros comuns e, para cada indicador, slug, título, descrição, parâmetros aceitos e URL.'
      security:
        -
          bearerAuth: {}
      parameters:
        -
          name: grupo
          in: query
          required: false
          description: 'Filtra por grupo.'
          schema:
            type: string
            enum:
              - estrategico
              - economico
              - territorial
