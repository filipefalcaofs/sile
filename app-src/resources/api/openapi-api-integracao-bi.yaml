components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    data_de:
      name: data_de
      in: query
      required: false
      description: 'Início do período (AAAA-MM-DD).'
      schema:
        type: string
        format: date
    data_ate:
      name: data_ate
      in: query
      required: false
      description: 'Fim do período (AAAA-MM-DD).'
      schema:
        type: string
        format: date
    setor:
      name: setor
      in: query
      required: false
      description: 'Código do setor.'
      schema:
        type: integer
        minimum: 1
    analista:
      name: analista
      in: query
      required: false
      description: 'Código do analista.'
      schema:
        type: integer
        minimum: 1
    bairro:
      name: bairro
      in: query
      required: false
      description: 'Parte do nome do bairro.'
      schema:
        type: string
        maxLength: 120
    cnae:
      name: cnae
      in: query
      required: false
      description: 'Código do CNAE (7 dígitos).'
      schema:
        type: string
        maxLength: 7
    categoria:
      name: categoria
      in: query
      required: false
      description: 'Categoria do processo.'
      schema:
        type: string
        enum:
          - malha_fina
          - sede_escritorio
          - expresso
          - semi_expresso
    agrupamento:
      name: agrupamento
      in: query
      required: false
      description: 'Agrupamento da série.'
      schema:
        type: string
        enum:
          - dia
          - semana
          - mes
        default: mes
    limite:
      name: limite
      in: query
      required: false
      description: 'Máximo de linhas (ou de itens, conforme o indicador).'
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    precisao:
      name: precisao
      in: query
      required: false
      description: 'Casas decimais da grade do mapa (3 ≈ 110 m).'
      schema:
        type: integer
        minimum: 2
        maximum: 5
        default: 3
    min_decididas:
      name: min_decididas
      in: query
      required: false
      description: 'Mínimo de decisões para entrar no ranking.'
      schema:
        type: integer
        minimum: 1
        default: 5
    situacao:
      name: situacao
      in: query
      required: false
      description: 'Situação de saturação.'
      schema:
        type: string
        enum:
          - ok
          - saturando
          - saturado
          - sem_capacidade
    apos_id:
      name: apos_id
      in: query
      required: false
      description: 'Traz os registros com id maior que este (use o ultimo_id da página anterior).'
      schema:
        type: integer
        minimum: 0
    limite_bruto:
      name: limite
      in: query
      required: false
      description: 'Linhas por página (padrão 1000, máximo 5000).'
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 1000
    atualizado_desde:
      name: atualizado_desde
      in: query
      required: false
      description: 'Só o que mudou desde esta data (AAAA-MM-DD ou ISO 8601), para carga incremental.'
      schema:
        type: string
    processo_id:
      name: processo_id
      in: query
      required: false
      description: 'Só os registros deste processo.'
      schema:
        type: integer
        minimum: 1
  schemas:
    Credenciais:
      type: object
      required:
        - usuario
        - senha
      properties:
        usuario:
          type: string
        senha:
          type: string
    Token:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expira_em_segundos:
          type: integer
          example: 3600
    PaginaDados:
      type: object
      properties:
        tabela:
          type: string
        gerado_em:
          type: string
          format: date-time
        quantidade:
          type: integer
        dados:
          type: array
          items:
            type: object
        paginacao:
          type: object
          properties:
            limite:
              type: integer
            ultimo_id:
              type: integer
              nullable: true
            tem_mais:
              type: boolean
            proxima_url:
              type: string
              nullable: true
    Indicador:
      type: object
      properties:
        indicador:
          type: string
        grupo:
          type: string
        titulo:
          type: string
        gerado_em:
          type: string
          format: date-time
        filtros:
          type: object
        dados:
          description: 'Objeto ou lista, conforme o indicador.'
