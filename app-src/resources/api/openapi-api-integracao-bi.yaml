        - 'Dados brutos'
      operationId: dados_processos
      summary: 'Tabela processos'
      description: |-
        Uma linha por solicitação protocolada (rascunhos ficam fora), com a situação atual, território, empresa (porte e natureza) e a decisão, quando houver.

        **Campos**

        - : Identificador do processo (chave das demais tabelas).
        - : Número do protocolo no Viabiliza.
        - : Situação atual (código).
        - : Situação atual (texto).
        - : Canal de entrada: portal, regin ou contingencia.
        - : Canal de entrada (texto).
        - : Tipo de serviço (chave de tipos-servico).
        - : Categoria da análise: expresso ou semi_expresso.
        - : Etapa operacional da análise (código).
        - : Etapa operacional da análise (texto).
        - : Fase da análise: distribuicao ou analise.
        - : Processo caiu na malha fina.
        - : Solicitação de escritório virtual.
        - : Atividade em área pública.
        - : Imóvel com acesso independente.
        - : Área pretendida para a atividade, em m².
        - : Tipo do imóvel normalizado.
        - : Zona urbanística identificada no imóvel.
        - : Bairro oficial, ou o informado quando não identificado.
        - : Bairro oficial identificado pela camada da prefeitura.
        - : Latitude do imóvel (arredondada a 3 casas sem dados identificados).
        - : Longitude do imóvel (idem).
        - : De onde veio o ponto do imóvel.
        - : Setor responsável (chave de setores).
        - : Analista responsável (chave de analistas).
        - : Porte da empresa.
        - : Natureza jurídica da empresa.
        - : Processo renovado por este, quando é renovação.
        - : Resultado da simulação feita antes do protocolo.
        - : Código do CNAE principal.
        - : Data e hora do protocolo.
        - : Data e hora da distribuição ao analista.
        - : Início da etapa atual da análise.
        - : Prazo (SLA) da etapa atual.
        - : Prazo para a atuação na Junta (BAP).
        - : Vinculação do BAP.
        - : Cancelamento.
        - : Tempo do protocolo à decisão, em horas úteis, sem o tempo com o requerente.
        - : Desfecho da decisão: deferida, indeferida, desativado, cassado ou revogado.
        - : Quem decidiu: expresso (automático) ou analise_tecnica.
        - : Data e hora da decisão.
        - : Criação do registro.
        - : Última atualização (use em atualizado_desde).
        - : CNPJ da empresa.
        - : Razão social.
        - : Nome fantasia.
        - : Logradouro do imóvel.
        - : Número do imóvel.
        - : Complemento do endereço.
        - : Bairro digitado no pedido.
        - : CEP do imóvel.
        - : Inscrição imobiliária.
        - : Referência externa do pedido (protocolo da JUCEB, quando houver).
        - : E-mail da empresa.
        - : Telefone da empresa.
        - : Nome do solicitante informado pela JUCEB.
        - : CPF do solicitante informado pela JUCEB.
        - : Nome do requerente com conta no portal.
        - : CPF do requerente.
        - : E-mail do requerente.
        - : Telefone do requerente.
        - : Motivo do cancelamento.
        - : Justificativa do registro por contingência.
      security:
        -
          bearerAuth: {}
      parameters:
        - $ref: '#/components/parameters/apos_id'
        - $ref: '#/components/parameters/limite_bruto'
        - $ref: '#/components/parameters/atualizado_desde'
        - $ref: '#/components/parameters/data_de'
        - $ref: '#/components/parameters/data_ate'
      responses:
        200:
